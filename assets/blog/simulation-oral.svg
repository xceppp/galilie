<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" role="img" aria-label="Simulation oral concours">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1B2129"/>
    <stop offset="100%" stop-color="#0E1116"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E8C77E"/>
    <stop offset="100%" stop-color="#C9A356"/>
  </linearGradient>
</defs>

<rect width="1200" height="514" fill="url(#bg)"/>
<circle cx="1020" cy="80" r="140" fill="#C9A356" opacity=".1"/>

<ellipse cx="380" cy="230" rx="160" ry="100" fill="#252D38" stroke="#C9A356" stroke-width="2"/>
<ellipse cx="780" cy="280" rx="140" ry="88" fill="#1F2630" stroke="#9BA3AD" stroke-width="2"/>
<text x="380" y="220" text-anchor="middle" fill="#E8C77E" font-family="Georgia, serif" font-size="26">Présentez-vous</text>
<text x="380" y="255" text-anchor="middle" fill="#9BA3AD" font-size="16" font-family="system-ui,sans-serif">Pourquoi ce parcours ?</text>
<text x="780" y="275" text-anchor="middle" fill="#C9A356" font-family="Georgia, serif" font-size="22">Réponse structurée</text>
<text x="780" y="305" text-anchor="middle" fill="#9BA3AD" font-size="14" font-family="system-ui,sans-serif">60–90 secondes</text>
<text x="600" y="450" text-anchor="middle" fill="#9BA3AD" font-family="system-ui,sans-serif" font-size="22" letter-spacing="3">SIMULATION D'ORAL</text>

</svg>
